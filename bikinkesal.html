<!DOCTYPE html>
<html lang="id">
<meta charset='UTF-8'/>
<meta content='width=device-width, initial-scale=1, user-scalable=1, minimum-scale=1, maximum-scale=5' name='viewport'/>
<meta content='IE=edge' http-equiv='X-UA-Compatible'/>
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sono:wght@600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nerko+One&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
<script src="https://unpkg.com/typeit@8.7.0/dist/index.umd.js"></script>
<link href="https://feeldreams.github.io/dibacadong/style.css" rel="stylesheet" type="text/css" />
<script src="https://kit.fontawesome.com/4f3ce16e3e.js" crossorigin="anonymous"></script>

<head>
<title>Maaf Aku Suka Bikin Kamu Kesel</title>
<link rel="icon" type="image/x-icon" href="https://malasid.github.io/favicon.png">
<meta name="description" content="HTML Bucin Malas.id">
</head>

<body>
   <!-- Ganti Audio di sini -->
   <audio src="https://feeldreams.github.io/audio/seandainya.mp3" id="linkmp3" class="sembunyi"></audio>
   
   <div id="bodyblur">
     <!-- Wallpaper -->
     <img src="https://feeldreams.github.io/papjalan2.jpeg" id="wallpaper"/>
   </div>
   
   <div id='Content'>
     <div id="loveIn">
       <!-- Tombol LOVE -->
       <label class='lovein' onclick="mulaiCerita()">&#10084;</label>
     </div>
     <p id="ket">Sentuh LOVEnya!</p>

     <div class="kumpulanwp sembunyi">
         <img src="https://feeldreams.github.io/papjalan.jpeg" id="wallpaper2"/>
         <img src="https://feeldreams.github.io/papjalan3.jpeg" id="wallpaper3"/>
         <img src="https://feeldreams.github.io/paplalulintas4.jpeg" id="wallpaper4"/>
     </div>

     <div id="pergeseran" class="sembunyi">
         <p><b><span>hii ayaangggg</span></b></p>
         <p><b><span>maaf yaa kalo aku<br>suka bkin kamu kesel</span></b></p>
         <p><b><span>aku cuma mau bilang</span></b></p>
         <p><b><span>pncet ini dlu ya 👉💌</span></b></p>
     </div>

     <p id="ketgeser" class="sembunyi">Klik untuk Geser!</p>

     <div id="pesanCinta" class="sembunyi">
       <blockquote id='bq'>
         <p id="kalimat"></p>
         <p id="pesanAkhir"></p>
       </blockquote>
     </div>
   </div>

<script>
const body = document.querySelector("body");
const iniwp = [];
let iden = 1;
iniwp[1] = document.getElementById("wallpaper").src;
iniwp[2] = document.getElementById("wallpaper2").src;
iniwp[3] = document.getElementById("wallpaper3").src;
iniwp[4] = document.getElementById("wallpaper4").src;

const kalimatText = `maaf ya aku belum bisa jadi yang terbaik buat kamu,<br><br>
                     aku juga gabisa sepenuhnya ngertiin gimana cara kamu ingin dicintai,<br><br>
                     aku terlalu banyak kurangnya buat cewe secantik kamu,<br><br>
                     tapi aku akan terus berusaha yang terbaik buat kamu hehe..`;
                     
const pesanAkhirText = "stay with me. i love uu 🤍";

const audio = new Audio(document.getElementById("linkmp3").src);

function mulaiCerita() {
    // Menyembunyikan tombol LOVE dan teks awal
    document.getElementById("loveIn").style.display = "none";
    document.getElementById("ket").style.display = "none";

    // Menampilkan elemen transisi kedua
    document.getElementById("pergeseran").classList.remove("sembunyi");
    document.getElementById("ketgeser").classList.remove("sembunyi");

    // Memutar lagu
    audio.play();

    // Menunggu beberapa detik lalu menampilkan teks transisi kedua
    setTimeout(() => {
        document.getElementById("pergeseran").classList.add("sembunyi");
        document.getElementById("ketgeser").classList.add("sembunyi");
        document.getElementById("pesanCinta").classList.remove("sembunyi");

        // Efek mengetik pada teks utama
        new TypeIt("#kalimat", {
            speed: 50,
            startDelay: 900
        }).type(kalimatText).go();

        new TypeIt("#pesanAkhir", {
            speed: 50,
            startDelay: 4000
        }).type(pesanAkhirText).go();

    }, 3000); // Tunda 3 detik sebelum menampilkan teks cinta
}
</script>

</body>
</html>
