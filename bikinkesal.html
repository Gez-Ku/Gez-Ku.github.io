<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman dengan Musik dan Transisi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            transition: opacity 1s ease-in-out;
            background: url('IMG20241003194050.jpg') no-repeat center center/cover;
        }

        .page2 {
            background: url('IMG20241003194050.jpg') no-repeat center center/cover;
        }

        .container {
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 10px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            background-color: #28a745;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #218838;
        }

        .fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    <audio autoplay loop>
        <source src="https://feeldreams.github.io/audio/seandainya.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung pemutar musik.
    </audio>

    <div class="container" id="content">
        <h1>Selamat Datang di Website Sederhana</h1>
        <button onclick="goToPage2()">Klik untuk Lanjut</button>
    </div>

    <script>
        function goToPage2() {
            document.body.classList.add("fade-out");
            setTimeout(() => {
                document.body.classList.add("page2");
                document.getElementById("content").innerHTML = "<h1>Ini adalah Halaman Kedua</h1><p>Terima kasih telah mengunjungi halaman ini.</p>";
                document.body.classList.remove("fade-out");
            }, 1000);
        }
    </script>
</body>
</html>
